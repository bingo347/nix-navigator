$rules:
  plural:
    args:
      number: int
    do:
      - if: "number % 10 == 1 && number % 100 != 11"
        then: one
      - if: "number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)"
        then: few
      - else: many

